'use strict';const ORIGIN=[-8.03801,-34.87178],storeName='Shopping Tacaruna',norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim(),status=document.querySelector('#status'),list=document.querySelector('#list');let map,group,bounds=[ORIGIN],generation=0,lastRequest=0,controller,tiles2030;const cacheKey='unigames-region-cache1980';let cache={};try{cache=JSON.parse(localStorage.getItem(cacheKey)||'{}')}catch{}const save=()=>{try{localStorage.setItem(cacheKey,JSON.stringify(cache))}catch{}};const textElement=(tag,text)=>{const node=document.createElement(tag);node.textContent=text;return node};
if(typeof L==='undefined'){status.textContent='Publique a pasta mapa-assets junto do HTML para carregar o mapa.'}else{map=L.map('map',{scrollWheelZoom:false}).setView(ORIGIN,12);tiles2030=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>'}).addTo(map);tiles2030.on('tileerror',()=>{const note=document.querySelector('#map-health2030');note.hidden=false;note.textContent='Mapa temporariamente indisponível. A lista de clientes continua acessível.'});tiles2030.on('tileload',()=>document.querySelector('#map-health2030').hidden=true);const marker=L.marker(ORIGIN,{icon:L.divIcon({className:'store-pin',html:'U',iconSize:[32,32],iconAnchor:[16,16]})}).addTo(map);marker.bindTooltip(storeName,{permanent:true,direction:'top',offset:[0,-15]});group=L.layerGroup().addTo(map);status.textContent='Loja localizada. Aguardando as regiões do relatório.'}document.querySelector('#reset').onclick=()=>{if(map)map.fitBounds(L.latLngBounds(bounds).pad(.2),{maxZoom:13,animate:false})};
function pickFeature(json,label,kind){const parts=label.split(' · '),name=norm(parts[0].split(' / ')[0]),city=kind==='city'?name:parts[1]?norm(parts[1].split(' / ')[0]):'',features=json.features||[];return features.find(f=>{const p=f.properties||{},c=f.geometry?.coordinates;if(!Array.isArray(c)||!Number.isFinite(c[0])||!Number.isFinite(c[1])||c[0]<-74||c[0]>-34||c[1]<-34||c[1]>6)return false;if(p.countrycode&&String(p.countrycode).toLowerCase()!=='br')return false;const names=[p.name,p.district,p.suburb,p.locality].map(norm);if(!names.includes(name))return false;const place=[p.city,p.county,p.district,p.name].map(norm);return !city||place.includes(city)})}
async function locate(label,kind,token){const key=kind+'|'+norm(label),old=cache[key],ttl=old?.point?180*864e5:864e5;if(old&&Date.now()-old.at<ttl)return old.point;const wait=Math.max(0,1100-(Date.now()-lastRequest));if(wait)await new Promise(r=>setTimeout(r,wait));if(token!==generation)return null;lastRequest=Date.now();controller=new AbortController();const timer=setTimeout(()=>controller.abort(),12000);try{const url=new URL('https://photon.komoot.io/api/');url.searchParams.set('q',label.replace(/ · | \/ /g,', ')+', Brasil');url.searchParams.set('limit','5');url.searchParams.set('lat',String(ORIGIN[0]));url.searchParams.set('lon',String(ORIGIN[1]));const response=await fetch(url,{signal:controller.signal});if(!response.ok)throw Error('Busca indisponível');const feature=pickFeature(await response.json(),label,kind),point=feature?{lat:feature.geometry.coordinates[1],lng:feature.geometry.coordinates[0]}:null;if(token===generation){cache[key]={at:Date.now(),point};save()}return point}catch(e){return null}finally{clearTimeout(timer)}}
window.addEventListener('message',async event=>{if(event.source!==parent||event.origin!==location.origin||event.data?.type!=='unigames-regions1980')return;document.documentElement.dataset.theme=event.data.theme==='dark'?'dark':'light';const token=++generation;controller?.abort();const rows=Array.isArray(event.data.rows)?event.data.rows.slice(0,5):[],kind=event.data.kind==='city'?'city':'district';if(map){group.clearLayers();map.setView(ORIGIN,12);requestAnimationFrame(()=>map.invalidateSize({pan:false}))}list.replaceChildren();bounds=[ORIGIN];let located=0;const nodes=rows.map((r,i)=>{const li=textElement('li','');li.style.borderLeftColor=['#376a9e','#7861a5','#34808e','#a5793e','#a45e7c'][i];li.append(textElement('b',(i+1)+'. '+String(r.name||'')),textElement('small','Localizando…'));li.append(textElement('p',String(r.clients||0)+' compradores · '+String(r.orders||0)+' vendas'));li.lastChild.className='region-count1990';const button=textElement('button','Ver clientes da área');button.type='button';button.className='region-clients1990';button.onclick=e=>{e.stopPropagation();parent.postMessage({type:'unigames-region-clients1990',kind,name:String(r.name||'')},location.protocol==='file:'?'*':location.origin)};li.append(button);list.append(li);return li});if(!map){nodes.forEach(li=>li.querySelector('small').textContent='Mapa indisponível; use o botão para consultar os clientes.');status.textContent='Publique mapa-assets para carregar o mapa. Clientes da área continuam disponíveis.';return}status.textContent=rows.length?'Localizando as '+rows.length+' regiões…':'Sem regiões com localização informada neste recorte.';for(let i=0;i<rows.length;i++){const r=rows[i],point=await locate(String(r.name||''),kind,token);if(token!==generation)return;const li=nodes[i];li.querySelector('small').remove();if(!point){li.classList.add('unlocated');li.append(textElement('small','Região não localizada com segurança. Confira cidade/UF.'));continue}located++;const latlng=[point.lat,point.lng],distance=L.latLng(ORIGIN).distanceTo(latlng)/1000;bounds.push(latlng);const label=distance.toLocaleString('pt-BR',{maximumFractionDigits:1})+' km em linha reta',distanceNode=textElement('small',label);distanceNode.className='distance';li.append(distanceNode);const pin=L.marker(latlng,{icon:L.divIcon({className:'region-pin',html:String(i+1),iconSize:[27,27],iconAnchor:[13,13]})}).addTo(group);const popup=textElement('div','');popup.append(textElement('b',String(r.name||'')),textElement('p',label+' até '+storeName));pin.bindPopup(popup);pin.bindTooltip(String(r.name||''));L.polyline([ORIGIN,latlng],{color:['#376a9e','#7861a5','#34808e','#a5793e','#a45e7c'][i],weight:2,dashArray:'5 6',opacity:.65}).addTo(group);li.style.cursor='pointer';li.onclick=()=>{map.setView(latlng,13);pin.openPopup()};status.textContent=located+' de '+rows.length+' regiões localizadas.'}map.invalidateSize({pan:false});map.fitBounds(L.latLngBounds(bounds).pad(.2),{maxZoom:13,animate:false});status.textContent=located+' de '+rows.length+' regiões localizadas · referência: '+storeName;});
document.querySelector('#retry2030').onclick=()=>{if(tiles2030){document.querySelector('#map-health2030').hidden=true;tiles2030.redraw()}if(map)map.invalidateSize({pan:false})};if(map&&typeof ResizeObserver!=='undefined')new ResizeObserver(()=>requestAnimationFrame(()=>map.invalidateSize({pan:false}))).observe(document.querySelector('#map'));document.addEventListener('visibilitychange',()=>{if(map&&!document.hidden)map.invalidateSize({pan:false})});
