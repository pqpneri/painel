<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="mapa-assets/leaflet.css"><title>Proximidade · Unigames Tacaruna</title><style>
*{box-sizing:border-box}body{margin:0;font:12px/1.5 system-ui,sans-serif;color:#284d6c;background:#edf3f9}#layout{display:grid;grid-template-columns:minmax(0,1fr) 235px;min-height:410px}#map{height:410px;background:#e4edf5}aside{padding:13px;max-height:410px;overflow:auto;border-left:1px solid #abc5d9;background:#f8fbff}h1{font-size:14px;margin:0 0 5px;color:#214d73}#status{font-size:11px;line-height:1.6;margin:0 0 10px;color:#506e87}#list{list-style:none;padding:0;margin:0}#list li{background:#fff;border:1px solid #bbd1e1;border-radius:9px;margin:0 0 8px;padding:10px;overflow-wrap:anywhere}#list b{display:block;font-size:12px;color:#24577f}#list small{font-size:10px;display:block;margin-top:4px;color:#56728b}.store-pin,.region-pin{display:grid;place-items:center;color:#fff;font-weight:750;border:2px solid #fff;box-shadow:0 3px 10px #19385460;border-radius:50%;background:#286697}.store-pin{border-radius:9px;background:#8c3b58;font-size:13px}.region-pin{font-size:12px}.distance{font-weight:750;color:#285d83!important}.leaflet-popup-content{font-size:12px}.legend{font-size:10px;color:#50718c;padding:8px 0}#reset{background:#285e89;color:#fff;border:1px solid #6c94b4;border-radius:7px;padding:7px 10px;cursor:pointer;font-size:11px;margin-bottom:10px}@media(max-width:650px){#layout{grid-template-columns:1fr}#map{height:300px}aside{max-height:180px;border-left:0;border-top:1px solid #abc5d9}#list{display:grid;grid-template-columns:1fr 1fr;gap:7px}#list li{margin:0}}.unlocated{border-left:3px solid #b77842!important}

#layout{grid-template-columns:minmax(0,1fr) 260px}aside{background:linear-gradient(145deg,#f6faff,#e8f0fa);padding:15px}h1{border-left:4px solid #376ca0;padding-left:9px;font-size:15px}#list li{border:1px solid #a2bad5;border-left:4px solid #416fa8;border-radius:11px;box-shadow:0 4px 10px #25456e10;padding:11px}#list li:nth-child(2){border-left-color:#6b58a2}#list li:nth-child(3){border-left-color:#30818b}.store-pin{background:linear-gradient(135deg,#173f78,#376ca7);border:3px solid white;box-shadow:0 0 0 7px #2d69a52b,0 4px 15px #163c7660}.region-pin{background:linear-gradient(135deg,#3d6fac,#214b80);box-shadow:0 0 0 4px #2f69a023,0 3px 10px #19385460}.region-clients1990{display:block;width:100%;margin-top:9px;background:#244e80;color:#fff;border:1px solid #6e95bd;border-radius:7px;padding:7px 9px;font:600 11px system-ui;cursor:pointer}.region-clients1990:hover{background:#32649b}.region-count1990{font-size:10px;color:#395d7e;margin:4px 0}.leaflet-tooltip{border:1px solid #7da1c2;border-radius:7px;color:#24476b}.leaflet-popup-content-wrapper{border-radius:12px;border:1px solid #8eacc7}#reset{background:#244e80;border-radius:8px}@media(max-width:650px){#layout{grid-template-columns:1fr}aside{max-height:180px;padding:10px}#list li{padding:9px}#list b{font-size:11px}}
</style></head><body><div id="layout"><div id="map" aria-label="Mapa com a loja e as regiões"></div><aside><h1>Shopping Tacaruna</h1><p class="legend">■ Loja · ● Regiões · linhas: distância aproximada</p><button id="reset" type="button">Ver loja e regiões</button><p id="status" role="status">Preparando mapa…</p><ol id="list"></ol><p class="legend">Coordenadas regionais aproximadas. Distâncias em linha reta, não trajeto. Base geográfica © OpenStreetMap · busca Photon.</p></aside></div><script src="mapa-assets/leaflet.js"></script><script>
'use strict';const ORIGIN=[-8.03801,-34.87178],storeName='Shopping Tacaruna',norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim(),status=document.querySelector('#status'),list=document.querySelector('#list');let map,group,bounds=[ORIGIN],generation=0,lastRequest=0,controller;const cacheKey='unigames-region-cache1980';let cache={};try{cache=JSON.parse(localStorage.getItem(cacheKey)||'{}')}catch{}const save=()=>{try{localStorage.setItem(cacheKey,JSON.stringify(cache))}catch{}};const textElement=(tag,text)=>{const node=document.createElement(tag);node.textContent=text;return node};
if(typeof L==='undefined'){status.textContent='Publique a pasta mapa-assets junto do HTML para carregar o mapa.'}else{map=L.map('map',{scrollWheelZoom:false}).setView(ORIGIN,12);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>'}).addTo(map);const marker=L.marker(ORIGIN,{icon:L.divIcon({className:'store-pin',html:'U',iconSize:[32,32],iconAnchor:[16,16]})}).addTo(map);marker.bindTooltip(storeName,{permanent:true,direction:'top',offset:[0,-15]});group=L.layerGroup().addTo(map);status.textContent='Loja localizada. Aguardando as regiões do relatório.'}document.querySelector('#reset').onclick=()=>{if(map)map.fitBounds(L.latLngBounds(bounds).pad(.2),{maxZoom:13,animate:false})};
function pickFeature(json,label,kind){const parts=label.split(' · '),name=norm(parts[0].split(' / ')[0]),city=kind==='city'?name:parts[1]?norm(parts[1].split(' / ')[0]):'',features=json.features||[];return features.find(f=>{const p=f.properties||{},c=f.geometry?.coordinates;if(!Array.isArray(c)||!Number.isFinite(c[0])||!Number.isFinite(c[1])||c[0]<-74||c[0]>-34||c[1]<-34||c[1]>6)return false;if(p.countrycode&&String(p.countrycode).toLowerCase()!=='br')return false;const names=[p.name,p.district,p.suburb,p.locality].map(norm);if(!names.includes(name))return false;const place=[p.city,p.county,p.district,p.name].map(norm);return !city||place.includes(city)})}
async function locate(label,kind,token){const key=kind+'|'+norm(label),old=cache[key],ttl=old?.point?180*864e5:864e5;if(old&&Date.now()-old.at<ttl)return old.point;const wait=Math.max(0,1100-(Date.now()-lastRequest));if(wait)await new Promise(r=>setTimeout(r,wait));if(token!==generation)return null;lastRequest=Date.now();controller=new AbortController();const timer=setTimeout(()=>controller.abort(),12000);try{const url=new URL('https://photon.komoot.io/api/');url.searchParams.set('q',label.replace(/ · | \/ /g,', ')+', Brasil');url.searchParams.set('limit','5');url.searchParams.set('lat',String(ORIGIN[0]));url.searchParams.set('lon',String(ORIGIN[1]));const response=await fetch(url,{signal:controller.signal});if(!response.ok)throw Error('Busca indisponível');const feature=pickFeature(await response.json(),label,kind),point=feature?{lat:feature.geometry.coordinates[1],lng:feature.geometry.coordinates[0]}:null;if(token===generation){cache[key]={at:Date.now(),point};save()}return point}catch(e){return null}finally{clearTimeout(timer)}}
window.addEventListener('message',async event=>{if(event.source!==parent||event.origin!==location.origin||event.data?.type!=='unigames-regions1980'||!map)return;const token=++generation;controller?.abort();const rows=Array.isArray(event.data.rows)?event.data.rows.slice(0,5):[],kind=event.data.kind==='city'?'city':'district';group.clearLayers();list.replaceChildren();bounds=[ORIGIN];map.setView(ORIGIN,12);let located=0;const nodes=rows.map((r,i)=>{const li=textElement('li','');li.append(textElement('b',(i+1)+'. '+String(r.name||'')),textElement('small','Localizando…'));li.append(textElement('p',String(r.clients||0)+' compradores · '+String(r.orders||0)+' vendas'));li.lastChild.className='region-count1990';const button=textElement('button','Ver clientes da área');button.type='button';button.className='region-clients1990';button.onclick=e=>{e.stopPropagation();parent.postMessage({type:'unigames-region-clients1990',kind,name:String(r.name||'')},location.origin)};li.append(button);list.append(li);return li});status.textContent=rows.length?'Localizando as '+rows.length+' regiões…':'Sem regiões com localização informada neste recorte.';for(let i=0;i<rows.length;i++){const r=rows[i],point=await locate(String(r.name||''),kind,token);if(token!==generation)return;const li=nodes[i];li.querySelector('small').remove();if(!point){li.classList.add('unlocated');li.append(textElement('small','Região não localizada com segurança. Confira cidade/UF.'));continue}located++;const latlng=[point.lat,point.lng],distance=L.latLng(ORIGIN).distanceTo(latlng)/1000;bounds.push(latlng);const label=distance.toLocaleString('pt-BR',{maximumFractionDigits:1})+' km em linha reta',distanceNode=textElement('small',label);distanceNode.className='distance';li.append(distanceNode);const pin=L.marker(latlng,{icon:L.divIcon({className:'region-pin',html:String(i+1),iconSize:[27,27],iconAnchor:[13,13]})}).addTo(group);const popup=textElement('div','');popup.append(textElement('b',String(r.name||'')),textElement('p',label+' até '+storeName));pin.bindPopup(popup);pin.bindTooltip(String(r.name||''));L.polyline([ORIGIN,latlng],{color:'#397aaa',weight:1.6,dashArray:'5 6',opacity:.65}).addTo(group);li.style.cursor='pointer';li.onclick=()=>{map.setView(latlng,13);pin.openPopup()};map.fitBounds(L.latLngBounds(bounds).pad(.2),{maxZoom:13,animate:false});status.textContent=located+' de '+rows.length+' regiões localizadas.'}status.textContent=located+' de '+rows.length+' regiões localizadas · referência: '+storeName;});
</script></body></html>
